<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Depot Supplies Store</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1e293b;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 20px;
            font-weight: 800;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .search-bar {
            display: flex;
            flex: 1;
            max-width: 550px;
            margin: 0 24px;
        }
        .search-bar input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 6px 0 0 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .search-bar input:focus {
            border-color: #38bdf8;
        }
        .search-bar button {
            padding: 10px 20px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 0 6px 6px 0;
            font-weight: 600;
            cursor: pointer;
        }
        .search-bar button:hover { background: #0369a1; }
        .cart-status {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #0f172a;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            cursor: pointer;
        }
        .cart-count {
            background: #0284c7;
            color: white;
            font-weight: 700;
            font-size: 13px;
            padding: 2px 8px;
            border-radius: 12px;
        }
        main {
            display: flex;
            padding: 24px 32px;
            gap: 24px;
        }
        .products-grid {
            flex: 3;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }
        .product-card:hover {
            transform: translateY(-2px);
            border-color: #38bdf8;
        }
        .product-title {
            font-size: 16px;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 6px;
        }
        .product-category {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 12px;
        }
        .product-price {
            font-size: 18px;
            font-weight: 800;
            color: #38bdf8;
            margin-bottom: 14px;
        }
        .add-to-cart-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .add-to-cart-btn:hover { background: #0369a1; }
        .sidebar {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 20px;
            height: fit-content;
            position: sticky;
            top: 90px;
        }
        .sidebar h3 {
            margin-top: 0;
            color: #38bdf8;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }
        .cart-list {
            list-style: none;
            padding: 0;
            margin: 0 0 16px 0;
            max-height: 250px;
            overflow-y: auto;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #273549;
            font-size: 13px;
        }
        .cart-total-box {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #f8fafc;
        }
        #checkout-btn {
            width: 100%;
            padding: 12px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }
        #checkout-btn:hover { background: #059669; }
        #order-success {
            display: none;
            margin-top: 16px;
            padding: 14px;
            background: #064e3b;
            border: 1px solid #047857;
            border-radius: 6px;
            text-align: center;
            color: #6ee7b7;
        }
        .invoice-btn {
            margin-top: 8px;
            background: #0284c7;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">🏢 OfficeSupply Depot</div>
    <div class="search-bar">
        <input type="text" id="searchInput" name="search" placeholder="Search office supplies, paper, pens, toner..." aria-label="Search">
        <button id="searchButton" type="button" onclick="filterProducts()">Search</button>
    </div>
    <div class="cart-status">
        🛒 Cart: <span id="cartCount" class="cart-count">0</span>
    </div>
</header>

<main>
    <div class="products-grid" id="productsGrid">
        <!-- Products populated by JS -->
    </div>

    <div class="sidebar">
        <h3>🛒 Order Summary</h3>
        <ul class="cart-list" id="cartList">
            <li style="color: #64748b; text-align: center; padding: 20px;">Cart is empty</li>
        </ul>
        <div class="cart-total-box">
            <span>Total:</span>
            <span id="cartTotal">₹0.00</span>
        </div>
        <button id="checkout-btn" onclick="openReviewOrder()">Review & Prepare Order</button>

        <div id="order-success">
            <strong>✓ Order Staged!</strong>
            <p style="margin: 6px 0 0 0; font-size: 13px;" id="orderIdText">Order #ORD-2026-9041</p>
            <p style="font-size: 12px; color: #a7f3d0;" id="orderVerifiedText">Items verified in cart.</p>
            <button class="invoice-btn" id="downloadInvoiceBtn" onclick="downloadInvoice()">📄 Download Invoice</button>
        </div>
    </div>
</main>

<script>
    const products = [
        { id: 1, name: "A4 Copy Paper Ream (500 Sheets)", category: "Paper & Stationery", price: 320, keywords: "paper a4 ream copy sheets" },
        { id: 2, name: "Ballpoint Pens (Pack of 50)", category: "Writing Instruments", price: 250, keywords: "pen pens ballpoint writing blue black" },
        { id: 3, name: "Whiteboard Markers (Set of 4)", category: "Presentation", price: 180, keywords: "whiteboard marker markers dry erase" },
        { id: 4, name: "Heavy Duty Stapler", category: "Desk Accessories", price: 350, keywords: "stapler staples heavy duty desk" },
        { id: 5, name: "Sticky Notes Pack (4 Pads)", category: "Paper & Stationery", price: 120, keywords: "sticky notes post it memo pads" },
        { id: 6, name: "Wireless Optical Mouse", category: "Electronics", price: 650, keywords: "mouse wireless computer optical usb" },
        { id: 7, name: "Desk Organizer Tray", category: "Desk Accessories", price: 420, keywords: "organizer tray desk pen holder" },
        { id: 8, name: "Ergonomic Office Chair Cushion", category: "Furniture & Comfort", price: 890, keywords: "chair cushion ergonomic back support" }
    ];

    let cart = [];

    function renderProducts(list) {
        const grid = document.getElementById("productsGrid");
        if (list.length === 0) {
            grid.innerHTML = "<div style='color:#94a3b8; padding:30px; grid-column:1/-1; text-align:center;'>No products matched your search query.</div>";
            return;
        }
        grid.innerHTML = list.map(p => `
            <div class="product-card" id="product-${p.id}">
                <div>
                    <div class="product-title">${p.name}</div>
                    <div class="product-category">${p.category}</div>
                </div>
                <div>
                    <div class="product-price">₹${p.price.toFixed(2)}</div>
                    <button class="add-to-cart-btn" id="add-btn-${p.id}" onclick="addToCart(${p.id})">Add to Cart</button>
                </div>
            </div>
        `).join("");
    }

    function filterProducts() {
        const query = (document.getElementById("searchInput").value || "").toLowerCase().trim();
        if (!query) {
            renderProducts(products);
            return;
        }
        const filtered = products.filter(p => 
            p.name.toLowerCase().includes(query) || 
            p.keywords.toLowerCase().includes(query) ||
            p.category.toLowerCase().includes(query)
        );
        renderProducts(filtered);
    }

    // Support Enter key in searchInput
    document.getElementById("searchInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            filterProducts();
        }
    });

    function addToCart(productId) {
        const item = products.find(p => p.id === productId);
        if (item) {
            cart.push(item);
            updateCartUI();
        }
    }

    function updateCartUI() {
        document.getElementById("cartCount").innerText = cart.length;
        const cartList = document.getElementById("cartList");
        if (cart.length === 0) {
            cartList.innerHTML = `<li style="color: #64748b; text-align: center; padding: 20px;">Cart is empty</li>`;
            document.getElementById("cartTotal").innerText = "₹0.00";
            return;
        }

        cartList.innerHTML = cart.map(item => `
            <li class="cart-item">
                <span>${item.name}</span>
                <span style="font-weight:700;">₹${item.price.toFixed(2)}</span>
            </li>
        `).join("");

        const total = cart.reduce((acc, curr) => acc + curr.price, 0);
        document.getElementById("cartTotal").innerText = `₹${total.toFixed(2)}`;
    }

    function openReviewOrder() {
        if (cart.length === 0) {
            alert("Cart is empty! Please add products before checking out.");
            return;
        }
        const total = cart.reduce((acc, curr) => acc + curr.price, 0);
        const orderId = "ORD-" + Math.floor(100000 + Math.random() * 900000);
        document.getElementById("orderIdText").innerText = `Order #${orderId} (Total: ₹${total.toFixed(2)})`;
        document.getElementById("orderVerifiedText").innerText = `✓ Verified ${cart.length} item(s) in cart. Ready for confirmation.`;
        document.getElementById("order-success").style.display = "block";
    }

    function downloadInvoice() {
        const blob = new Blob([
            `OFFICE SUPPLY DEPOT - INVOICE\nOrder: ${document.getElementById("orderIdText").innerText}\nDate: ${new Date().toLocaleDateString()}\nStatus: Staged / Pending Confirmation\nItems: ${cart.map(c => c.name + " (₹" + c.price + ")").join(", ")}\nTotal: ${document.getElementById("cartTotal").innerText}\n`
        ], { type: "text/plain" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "office_supply_invoice.txt";
        a.click();
    }

    // Initial render
    renderProducts(products);
</script>

</body>
</html>
